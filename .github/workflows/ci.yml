name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Fast feedback: formatting, vet and the tests that need nothing but Go.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: make lint
      - run: make test

      # install.sh is now the first thing a new user runs, and a shell script
      # fails at the person it was meant to help rather than at build time.
      - run: shellcheck install.sh

  # The behaviour worth protecting — the guard against a real server, streamed
  # results, KILL QUERY, catalog reads and the interface itself — only exists
  # under the integration tag, so CI that skipped this would be checking the
  # least interesting half.
  integration:
    runs-on: ubuntu-latest

    # Both servers, because "MySQL-compatible" is a claim about a protocol and
    # this program makes claims about behaviour: reserved words, fractional
    # timestamps and what information_schema answers are not the same on the
    # two, and a suite that only ever met one of them cannot say which half of
    # the README is true. fail-fast off, so a break on one still reports the
    # other rather than hiding it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: mariadb:11.4
            # The mariadb image dropped the mysql* symlinks, so the two
            # health checks cannot be one string.
            ping: mariadb-admin ping -uroot -pdatavase-test --silent
          - server: mysql:8.4
            ping: mysqladmin ping -uroot -pdatavase-test --silent

    services:
      db:
        image: ${{ matrix.server }}
        # MYSQL_* rather than MARIADB_*: the MariaDB image still honours them,
        # which is what lets one service block serve both.
        env:
          MYSQL_ROOT_PASSWORD: datavase-test
          MYSQL_DATABASE: datavase_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.ping }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The Makefile's container listens on 13306; the service container here
      # is mapped to the standard port instead.
      DATAVASE_TEST_PORT: 3306

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: make test-integration

  # The release, rehearsed on every change rather than discovered at tag time
  # when it is too late to fix quietly.
  #
  # This replaces a build matrix that listed the platforms a second time: the
  # snapshot builds every target .goreleaser.yaml declares, so the list cannot
  # drift, and it also exercises the archives, the Linux packages and the
  # Homebrew cask — none of which a `go build` would have compiled at all. It
  # publishes nothing; --snapshot refuses to.
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
