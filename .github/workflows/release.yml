name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # goreleaser creates the GitHub release and uploads archives
  id-token: write # the attestation is signed against this run's OIDC identity
  attestations: write # and stored on the repository

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    # HOMEBREW_TAP_GITHUB_TOKEN is an environment secret, and an environment
    # secret reaches a job only when the job names its environment. Without
    # this line it does not arrive as an error — it arrives as an empty string,
    # indistinguishable from a secret nobody added, and the cask is skipped by
    # a release that otherwise looks like it worked.
    environment: HOMEBREW_TAP

    steps:
      # Skipping the cask keeps a release from failing after it has already
      # uploaded its archives, but a silent skip cannot be told apart from a
      # misconfigured one — an environment secret reaching a job that did not
      # name its environment is empty, exactly like one nobody added. Say so
      # where the run can be seen, and carry on.
      - name: Report whether the Homebrew cask can be published
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN is empty. The Homebrew cask will not be published, so 'brew install Ahngbeom/tap/dv' will keep serving the previous version. Every other artifact is unaffected."
          else
            echo "Homebrew tap token present; the cask will be published."
          fi

      - uses: actions/checkout@v4
        with:
          # goreleaser builds the changelog from the commits since the last
          # tag, which a shallow clone does not contain.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN is scoped to this repository, so it cannot push the
          # cask to Ahngbeom/homebrew-tap. A secret that has not been added
          # arrives here as an empty string, which .goreleaser.yaml reads as
          # "skip the cask" rather than failing a release that has already
          # uploaded its archives.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # After goreleaser, because dist/checksums.txt is written by it and the
      # release is already published by the time it exists — attesting is
      # necessarily the last thing that happens.
      #
      # subject-checksums takes the whole file, so one call covers every file
      # checksums.txt lists rather than needing a subject per archive and
      # package. checksums.txt does not list itself, so it is the one asset
      # with no attestation.
      #
      # This is deliberately allowed to fail the run. The cask is skipped
      # quietly when its token is missing because the release is still whole
      # without it; a missing attestation is not like that. Nobody goes looking
      # for a signature that was never there, so the run has to be the thing
      # that says so.
      #
      # By the time this step runs, goreleaser has already published the
      # release whose footer claims every archive and package is signed, so
      # a failure here leaves that claim false for whatever is missing.
      # Re-running the workflow does not fix it: goreleaser refuses to
      # publish to a release that already exists and fails before reaching
      # this step. Recovery is to delete the GitHub release and re-run the
      # workflow, or to attest the existing checksums.txt out of band.
      - name: Attest what this run built
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ./dist/checksums.txt
